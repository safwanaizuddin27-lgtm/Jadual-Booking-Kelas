<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadual Kelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1FA;
    --surface:#FFFFFF;
    --surface-2:#FBFAFF;
    --ink:#241F3D;
    --ink-soft:#655D86;
    --border:#E4DFF5;
    --header-bg:#241D46;
    --header-bg-2:#332867;
    --shadow:rgba(43,34,80,0.14);
    --danger-bg:#FDE9EC;
    --danger-ink:#B3213A;
    --danger-border:#F3C1CB;
    --live-bg:#E7F8EE;
    --live-ink:#1B8A4C;
    --live-border:#BEEBD0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171229;
      --surface:#241D3F;
      --surface-2:#2B2349;
      --ink:#F1EEFA;
      --ink-soft:#C3BBE0;
      --border:#3C3462;
      --header-bg:#100B22;
      --header-bg-2:#1D1640;
      --shadow:rgba(0,0,0,0.45);
      --danger-bg:#3A1E27;
      --danger-ink:#FF9DAE;
      --danger-border:#5C2A38;
      --live-bg:#12331F;
      --live-ink:#6FE3A0;
      --live-border:#1F5C3C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171229;
    --surface:#241D3F;
    --surface-2:#2B2349;
    --ink:#F1EEFA;
    --ink-soft:#C3BBE0;
    --border:#3C3462;
    --header-bg:#100B22;
    --header-bg-2:#1D1640;
    --shadow:rgba(0,0,0,0.45);
    --danger-bg:#3A1E27;
    --danger-ink:#FF9DAE;
    --danger-border:#5C2A38;
    --live-bg:#12331F;
    --live-ink:#6FE3A0;
    --live-border:#1F5C3C;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.display{font-family:'Fredoka',system-ui,sans-serif;}

  .rainbow-strip{
    height:6px;
    width:100%;
    background:linear-gradient(90deg,#FF6B6B,#FFB703,#2EC4B6,#457B9D,#C77DFF);
  }

  header.top{
    background:linear-gradient(155deg,var(--header-bg),var(--header-bg-2));
    color:#F6F4FF;
    padding:28px 20px 34px;
  }
  .top-inner{
    max-width:720px;
    margin:0 auto;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }
  .top-inner h1{
    font-size:28px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  .top-inner p{
    margin:0;
    color:#CFC9EE;
    font-size:14.5px;
    max-width:38ch;
  }
  .add-btn{
    flex:0 0 auto;
    width:52px;height:52px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:linear-gradient(135deg,#FF6B6B,#FFB703);
    color:#241D46;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(255,107,107,0.35);
    transition:transform 0.15s ease;
  }
  .add-btn:hover{transform:translateY(-2px) scale(1.03);}
  .add-btn:active{transform:translateY(0) scale(0.97);}
  .add-btn svg{width:24px;height:24px;}
  .add-btn:disabled{
    opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;
  }

  main{
    max-width:720px;
    margin:-16px auto 60px;
    padding:0 20px;
  }

  .banner{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
    box-shadow:0 6px 18px var(--shadow);
  }
  .banner strong{color:var(--ink);}
  .banner[hidden]{display:none;}

  #calendar{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .day-card{
    background:var(--surface);
    border-radius:18px;
    border:1px solid var(--border);
    box-shadow:0 10px 26px var(--shadow);
    overflow:hidden;
  }
  .day-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:16px 18px 12px;
    border-bottom:1px solid var(--border);
  }
  .day-name{
    font-family:'Fredoka',system-ui,sans-serif;
    font-weight:600;
    font-size:18px;
  }
  .day-date{
    color:var(--ink-soft);
    font-size:14px;
  }

  .class-list{
    list-style:none;
    margin:0;
    padding:6px 10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .class-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 10px 12px 14px;
    border-radius:12px;
    background:var(--surface-2);
    border-left:5px solid var(--accent);
  }
  .class-main{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .subject-name{
    font-weight:700;
    color:var(--accent);
    font-size:15px;
  }
  .teacher-name{
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:0.3px;
  }
  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:4px;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:3px 9px 3px 7px;
    border-radius:999px;
    background:var(--live-bg);
    color:var(--live-ink);
    border:1px solid var(--live-border);
    width:fit-content;
  }
  .status-badge .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--live-ink);
    flex:0 0 auto;
  }
  @media (prefers-reduced-motion:no-preference){
    .status-badge .dot{animation:pulse-dot 1.6s ease-in-out infinite;}
  }
  @keyframes pulse-dot{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }
  .class-time{
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    color:var(--ink);
  }
  .class-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .delete-btn{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .delete-btn:hover{
    color:var(--danger-ink);
    border-color:var(--danger-border);
    background:var(--danger-bg);
  }
  .delete-btn svg{width:14px;height:14px;}
  body.read-only .delete-btn{display:none;}

  .empty-state{
    text-align:center;
    padding:52px 20px;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:18px;
  }
  .empty-state .display{font-size:17px;color:var(--ink);margin-bottom:6px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,15,40,0.5);
    display:flex;align-items:flex-end;justify-content:center;
    padding:0;
    z-index:50;
  }
  .overlay[hidden]{display:none;}
  @media (min-width:640px){
    .overlay{align-items:center;padding:20px;}
  }

  .sheet{
    background:var(--surface);
    width:100%;
    max-width:440px;
    border-radius:22px 22px 0 0;
    padding:22px 22px 26px;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 -10px 40px rgba(0,0,0,0.25);
  }
  @media (min-width:640px){
    .sheet{border-radius:22px;}
  }
  @media (prefers-reduced-motion:no-preference){
    .sheet{animation:rise 0.22s ease-out;}
  }
  @keyframes rise{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .sheet h2{
    font-size:20px;font-weight:600;margin:0 0 4px;
  }
  .sheet .sub{
    color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field select,.field input{
    width:100%;
    padding:11px 12px;
    border-radius:11px;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
  }
  .field input#teacher-input{text-transform:uppercase;}
  .field select:focus,.field input:focus{
    outline:2px solid #7C6CE8;outline-offset:1px;
  }
  .field select:disabled{opacity:0.6;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .form-error{
    background:var(--danger-bg);
    color:var(--danger-ink);
    border:1px solid var(--danger-border);
    border-radius:11px;
    padding:10px 12px;
    font-size:13.5px;
    margin-bottom:14px;
  }
  .form-error[hidden]{display:none;}

  .sheet-actions{
    display:flex;gap:10px;margin-top:18px;
  }
  button.btn{
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    border-radius:12px;
    padding:12px 16px;
    border:none;
    cursor:pointer;
  }
  button.btn.primary{
    flex:1;
    background:#241D46;
    color:#fff;
  }
  button.btn.primary:disabled{opacity:0.6;cursor:wait;}
  button.btn.ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--border);
  }
  button.btn.danger{
    flex:1;
    background:#D9364B;
    color:#fff;
  }
  button.btn.danger:disabled{opacity:0.6;cursor:wait;}

  .clash-icon{
    width:40px;height:40px;border-radius:50%;
    background:var(--danger-bg);
    color:var(--danger-ink);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:12px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;
  }
  #clash-message{font-size:14.5px;line-height:1.5;margin:0 0 4px;}
  #clash-message strong{color:var(--ink);}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
</style>
</head>
<body>

<div class="rainbow-strip"></div>
<header class="top">
  <div class="top-inner">
    <div>
      <h1>Jadual Kelas</h1>
      <p>Semak siapa dah tempah slot kelas — dan tempah slot baharu.</p>
    </div>
    <button type="button" class="add-btn" id="open-add-btn" aria-label="Tambah tempahan kelas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="calendar"><!-- rendered by script --></div>
</main>

<!-- Add booking sheet -->
<div class="overlay" id="add-overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <h2 id="add-title">Tempah slot kelas</h2>
    <p class="sub">Isikan butiran di bawah untuk menambah pada jadual.</p>

    <div class="form-error" id="form-error" hidden></div>

    <form id="add-form">
      <div class="field">
        <label for="subject-input">Subjek</label>
        <select id="subject-input" required></select>
      </div>

      <div class="field">
        <label for="teacher-input">Cikgu</label>
        <input type="text" id="teacher-input" placeholder="CONTOH: CIKGU AZURAH" required>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="date-input">Tarikh</label>
          <input type="date" id="date-input" required>
        </div>
        <div class="field">
          <label for="day-input">Hari</label>
          <select id="day-input" disabled></select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="from-input">Masa mula</label>
          <input type="time" id="from-input" required>
        </div>
        <div class="field">
          <label for="to-input">Masa tamat</label>
          <input type="time" id="to-input" required>
        </div>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="cancel-add-btn">Batal</button>
        <button type="submit" class="btn primary" id="submit-add-btn">Simpan tempahan</button>
      </div>
    </form>
  </div>
</div>

<!-- Clash confirm sheet -->
<div class="overlay" id="clash-overlay" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="clash-title">
    <div class="clash-icon">!</div>
    <h2 id="clash-title">Pertembungan masa</h2>
    <p id="clash-message"></p>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="clash-cancel-btn">Batal</button>
      <button type="button" class="btn primary" id="clash-confirm-btn">Ya, tetap tempah</button>
    </div>
  </div>
</div>

<!-- Cancel class confirm sheet -->
<div class="overlay" id="cancel-overlay" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="cancel-title">
    <h2 id="cancel-title">Batalkan kelas ini?</h2>
    <p id="cancel-message" class="sub" style="margin-bottom:14px;"></p>
    <div class="form-error" id="cancel-error" hidden></div>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="cancel-no-btn">Jangan batal</button>
      <button type="button" class="btn danger" id="cancel-yes-btn">Ya, batalkan kelas</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SUBJECTS = [
    {name:"Bahasa Melayu", color:"#E63946"},
    {name:"English", color:"#457B9D"},
    {name:"Sejarah", color:"#A9722B"},
    {name:"Matematik", color:"#2A9D8F"},
    {name:"Pendidikan Islam", color:"#6A4C93"},
    {name:"Pendidikan Moral", color:"#C048B8"},
    {name:"Matematik Tambahan", color:"#F4762A"},
    {name:"Biologi", color:"#4C8C4A"},
    {name:"Kimia", color:"#D8A400"},
    {name:"Fizik", color:"#EF476F"}
  ];
  var SUBJECT_COLOR = {};
  SUBJECTS.forEach(function(s){ SUBJECT_COLOR[s.name] = s.color; });

  // Pairs that are allowed to clash without a warning (e.g. students split
  // between Pendidikan Islam and Pendidikan Moral at the same time).
  var EXEMPT_PAIRS = [["Pendidikan Islam","Pendidikan Moral"]];

  var JS_DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DAY_LABELS_MS = {
    "Sunday":"Sunday","Monday":"Monday","Tuesday":"Tuesday","Wednesday":"Wednesday",
    "Thursday":"Thursday","Friday":"Friday","Saturday":"Saturday"
  };

  var bookings = [];
  var pendingBooking = null;

  var calendarEl = document.getElementById('calendar');
  var addOverlay = document.getElementById('add-overlay');
  var clashOverlay = document.getElementById('clash-overlay');
  var openAddBtn = document.getElementById('open-add-btn');
  var cancelAddBtn = document.getElementById('cancel-add-btn');
  var addForm = document.getElementById('add-form');
  var submitBtn = document.getElementById('submit-add-btn');
  var formErrorEl = document.getElementById('form-error');
  var subjectInput = document.getElementById('subject-input');
  var teacherInput = document.getElementById('teacher-input');
  var dateInput = document.getElementById('date-input');
  var dayInput = document.getElementById('day-input');
  var fromInput = document.getElementById('from-input');
  var toInput = document.getElementById('to-input');
  var clashMessageEl = document.getElementById('clash-message');
  var clashCancelBtn = document.getElementById('clash-cancel-btn');
  var clashConfirmBtn = document.getElementById('clash-confirm-btn');
  var cancelOverlay = document.getElementById('cancel-overlay');
  var cancelMessageEl = document.getElementById('cancel-message');
  var cancelErrorEl = document.getElementById('cancel-error');
  var cancelNoBtn = document.getElementById('cancel-no-btn');
  var cancelYesBtn = document.getElementById('cancel-yes-btn');
  var pendingDeleteId = null;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function populateSelects(){
    subjectInput.innerHTML = '<option value="" disabled selected>Pilih subjek</option>' +
      SUBJECTS.map(function(s){ return '<option value="'+escapeHtml(s.name)+'">'+escapeHtml(s.name)+'</option>'; }).join('');
    dayInput.innerHTML = '<option value="">—</option>' +
      JS_DAYS.map(function(d){ return '<option value="'+d+'">'+DAY_LABELS_MS[d]+'</option>'; }).join('');
  }

  function dayNameFromISODate(iso){
    var d = new Date(iso + 'T00:00:00');
    if(isNaN(d.getTime())) return '';
    return JS_DAYS[d.getDay()];
  }

  function formatDateDisplay(iso){
    var parts = iso.split('-');
    if(parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function formatTimeDisplay(t){
    return String(t).replace(/^0(\d:)/, '$1');
  }

  function toMinutes(t){
    var parts = String(t).split(':');
    return (parseInt(parts[0],10) || 0) * 60 + (parseInt(parts[1],10) || 0);
  }

  function timesOverlap(aFrom, aTo, bFrom, bTo){
    return toMinutes(aFrom) < toMinutes(bTo) && toMinutes(bFrom) < toMinutes(aTo);
  }

  // Builds a real Date from a booking's date + time-of-day fields.
  function bookingDateTime(dateISO, hhmm){
    var parts = String(hhmm).split(':');
    var h = parseInt(parts[0], 10) || 0;
    var m = parseInt(parts[1], 10) || 0;
    var d = new Date(dateISO + 'T00:00:00');
    d.setHours(h, m, 0, 0);
    return d;
  }

  // 'upcoming' | 'ongoing' | 'ended', relative to `now`.
  function getClassStatus(b, now){
    var start = bookingDateTime(b.date, b.from);
    var end = bookingDateTime(b.date, b.to);
    if(now >= end) return 'ended';
    if(now >= start) return 'ongoing';
    return 'upcoming';
  }

  function isExemptClash(subjA, subjB){
    if(subjA === subjB) return false;
    for(var i=0;i<EXEMPT_PAIRS.length;i++){
      var pair = EXEMPT_PAIRS[i];
      if(pair.indexOf(subjA) !== -1 && pair.indexOf(subjB) !== -1) return true;
    }
    return false;
  }

  function groupAndSort(list){
    var byDate = {};
    list.forEach(function(b){
      if(!byDate[b.date]) byDate[b.date] = [];
      byDate[b.date].push(b);
    });
    var dates = Object.keys(byDate).sort();
    return dates.map(function(d){
      var items = byDate[d].slice().sort(function(a,b){ return a.from.localeCompare(b.from); });
      return {date:d, day: dayNameFromISODate(d), items: items};
    });
  }

  function classRowHTML(b){
    var color = SUBJECT_COLOR[b.subject] || '#7C6CE8';
    var status = getClassStatus(b, new Date());
    var badge = status === 'ongoing'
      ? '<span class="status-badge"><span class="dot"></span>Sedang Berlangsung</span>'
      : '';
    return '<li class="class-row" style="--accent:'+color+'">' +
      '<div class="class-main">' +
        '<span class="subject-name">'+escapeHtml(b.subject)+'</span>' +
        '<span class="teacher-name">'+escapeHtml(b.teacher)+'</span>' +
        badge +
      '</div>' +
      '<div class="class-right">' +
        '<div class="class-time">'+escapeHtml(formatTimeDisplay(b.from))+' – '+escapeHtml(formatTimeDisplay(b.to))+'</div>' +
        '<button type="button" class="delete-btn" data-id="'+escapeHtml(b.id)+'" aria-label="Batalkan kelas ini">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
        '</button>' +
      '</div>' +
    '</li>';
  }

  function dayCardHTML(g){
    return '<section class="day-card">' +
      '<header class="day-head">' +
        '<span class="day-name">'+escapeHtml(DAY_LABELS_MS[g.day] || g.day)+'</span>' +
        '<span class="day-date">('+escapeHtml(formatDateDisplay(g.date))+')</span>' +
      '</header>' +
      '<ul class="class-list">' + g.items.map(classRowHTML).join('') + '</ul>' +
    '</section>';
  }

  function render(){
    var groups = groupAndSort(bookings);
    if(groups.length === 0){
      calendarEl.innerHTML = '<div class="empty-state">' +
        '<div class="display">Belum ada tempahan</div>' +
        '<div>Tekan butang + di atas untuk tempah slot kelas pertama.</div>' +
      '</div>';
      return;
    }
    calendarEl.innerHTML = groups.map(dayCardHTML).join('');
  }

  function showFormError(msg){
    formErrorEl.textContent = msg;
    formErrorEl.hidden = false;
  }
  function clearFormError(){
    formErrorEl.hidden = true;
    formErrorEl.textContent = '';
  }

  function openAddSheet(){
    clearFormError();
    addForm.reset();
    subjectInput.selectedIndex = 0;
    dayInput.innerHTML = '<option value="">Pilih tarikh dahulu</option>';
    addOverlay.hidden = false;
    subjectInput.focus();
  }
  function closeAddSheet(){
    addOverlay.hidden = true;
  }

  function setSubmitLoading(loading){
    submitBtn.disabled = loading;
    submitBtn.textContent = loading ? 'Menyimpan…' : 'Simpan tempahan';
  }

  dateInput.addEventListener('change', function(){
    var dayName = dayNameFromISODate(dateInput.value);
    if(!dayName){
      dayInput.innerHTML = '<option value="">—</option>';
      return;
    }
    dayInput.innerHTML = '<option value="'+dayName+'">'+DAY_LABELS_MS[dayName]+'</option>';
    dayInput.value = dayName;
  });

  openAddBtn.addEventListener('click', openAddSheet);
  cancelAddBtn.addEventListener('click', closeAddSheet);
  addOverlay.addEventListener('click', function(e){ if(e.target === addOverlay) closeAddSheet(); });

  function readFormFields(){
    return {
      subject: subjectInput.value,
      teacher: teacherInput.value.trim().toUpperCase(),
      date: dateInput.value,
      day: dayInput.value || dayNameFromISODate(dateInput.value),
      from: fromInput.value,
      to: toInput.value
    };
  }

  addForm.addEventListener('submit', function(e){
    e.preventDefault();
    clearFormError();
    var f = readFormFields();
    if(!f.subject || !f.teacher || !f.date || !f.from || !f.to){
      showFormError('Sila lengkapkan semua ruangan.');
      return;
    }
    if(toMinutes(f.from) >= toMinutes(f.to)){
      showFormError('Masa tamat mestilah selepas masa mula.');
      return;
    }
    var clashes = bookings.filter(function(b){
      return b.date === f.date &&
        timesOverlap(b.from, b.to, f.from, f.to) &&
        !isExemptClash(b.subject, f.subject);
    });
    if(clashes.length > 0){
      var c = clashes[0];
      pendingBooking = f;
      clashMessageEl.innerHTML = 'Ada pertembungan! <strong>' + escapeHtml(c.subject) + '</strong> (' +
        escapeHtml(c.teacher) + ') sudah ditempah pada ' + escapeHtml(formatTimeDisplay(c.from)) +
        '–' + escapeHtml(formatTimeDisplay(c.to)) + '. Teruskan tempah slot baharu ini juga?';
      clashOverlay.hidden = false;
      return;
    }
    saveBooking(f);
  });

  clashCancelBtn.addEventListener('click', function(){
    pendingBooking = null;
    clashOverlay.hidden = true;
  });
  clashConfirmBtn.addEventListener('click', function(){
    clashOverlay.hidden = true;
    if(pendingBooking){
      saveBooking(pendingBooking);
      pendingBooking = null;
    }
  });
  clashOverlay.addEventListener('click', function(e){ if(e.target === clashOverlay){ pendingBooking = null; clashOverlay.hidden = true; } });

  function genId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'b-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  var STORAGE_KEY = 'jadual-kelas-bookings';

  function loadFromStorage(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch(e){ return []; }
  }

  // Applies computeFn(currentBaseline) and saves the result to this
  // browser's local storage. Runs synchronously; kept async-shaped so the
  // call sites (and their loading states) don't need to change.
  async function persistState(computeFn){
    var candidate = computeFn(bookings);
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(candidate));
      bookings = candidate;
      render();
      return {ok:true};
    } catch(e){
      return {ok:false, message:'Gagal menyimpan pada peranti ini. Storan pelayar mungkin penuh atau disekat.'};
    }
  }

  async function saveBooking(fields){
    setSubmitLoading(true);
    var newBooking = {
      id: genId(),
      subject: fields.subject,
      teacher: fields.teacher,
      day: fields.day,
      date: fields.date,
      from: fields.from,
      to: fields.to
    };
    var result = await persistState(function(base){ return base.concat([newBooking]); });
    setSubmitLoading(false);
    if(result.ok){
      closeAddSheet();
    } else {
      showFormError(result.message);
    }
  }

  function findBooking(id){
    for(var i=0;i<bookings.length;i++){ if(bookings[i].id === id) return bookings[i]; }
    return null;
  }

  function openCancelSheet(booking){
    pendingDeleteId = booking.id;
    cancelErrorEl.hidden = true;
    cancelErrorEl.textContent = '';
    cancelMessageEl.innerHTML = escapeHtml(booking.subject) + ' (' + escapeHtml(booking.teacher) + '), ' +
      escapeHtml(formatDateDisplay(booking.date)) + ', ' + escapeHtml(formatTimeDisplay(booking.from)) +
      '–' + escapeHtml(formatTimeDisplay(booking.to)) + '. Tindakan ini tidak boleh diundur.';
    cancelOverlay.hidden = false;
  }
  function closeCancelSheet(){
    cancelOverlay.hidden = true;
    pendingDeleteId = null;
  }
  function setCancelLoading(loading){
    cancelYesBtn.disabled = loading;
    cancelYesBtn.textContent = loading ? 'Membatalkan…' : 'Ya, batalkan kelas';
  }

  calendarEl.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.delete-btn') : null;
    if(!btn) return;
    var id = btn.getAttribute('data-id');
    var booking = findBooking(id);
    if(booking) openCancelSheet(booking);
  });

  cancelNoBtn.addEventListener('click', closeCancelSheet);
  cancelOverlay.addEventListener('click', function(e){ if(e.target === cancelOverlay) closeCancelSheet(); });
  cancelYesBtn.addEventListener('click', async function(){
    if(!pendingDeleteId) return;
    var id = pendingDeleteId;
    setCancelLoading(true);
    var result = await persistState(function(base){ return base.filter(function(b){ return b.id !== id; }); });
    setCancelLoading(false);
    if(result.ok){
      closeCancelSheet();
    } else {
      cancelErrorEl.textContent = result.message;
      cancelErrorEl.hidden = false;
    }
  });

  // Removes any booking whose end time has passed, and re-renders so
  // "Sedang Berlangsung" badges stay accurate as time moves on. Runs once
  // at load and then on an interval.
  async function tick(){
    var now = new Date();
    var anyEnded = bookings.some(function(b){ return getClassStatus(b, now) === 'ended'; });
    if(anyEnded){
      await persistState(function(base){
        var n = new Date();
        return base.filter(function(b){ return getClassStatus(b, n) !== 'ended'; });
      });
    } else {
      render();
    }
  }

  function init(){
    populateSelects();
    bookings = loadFromStorage();
    render();
    tick();
    setInterval(tick, 60000);
  }

  init();
})();
</script>
</body>
</html>
